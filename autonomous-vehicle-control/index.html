<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C++ Autonomous Vehicle Simulator</title><style>body{background:#091522;color:#eef4ff;font:16px system-ui;margin:0;padding:20px}main{max-width:850px;margin:auto}canvas{width:100%;background:#283b38;border-radius:12px}button{padding:12px;margin:6px;background:#256bce;color:white;border:0;border-radius:8px}#state{font-weight:bold;color:#72e5b0}section{background:#16273b;border-radius:12px;padding:16px;margin:12px 0}input{width:100%}</style><main><h1>C++ Autonomous Driving Simulator</h1><p id="state">Loading compiled C++ controller…</p><section><canvas id="road" width="800" height="460"></canvas><p id="metrics">Waiting for controller</p></section><section><button id="start" disabled>Start driving</button><button id="stop">Pause</button><button id="hazard">Sudden hazard</button><button id="reset">Reset</button><label>Target speed <output id="targetLabel">75</output> km/h<input id="target" type="range" min="20" max="110" value="75"></label><label><input type="checkbox" id="failure" style="width:auto"> Simulate sensor failure</label></section><p>Longitudinal acceleration is calculated by C++17 compiled to WebAssembly. The roadway is a simplified animated 2D visualization. Educational prototype; not suitable for real vehicles.</p></main><script src="./controller.js"></script><script>
const $=id=>document.getElementById(id),ctx=$('road').getContext('2d');let av=null,running=false,last=0,ego=0,lead=14,gap=65,position=0,acc=0,emergency=false;
function reset(){running=false;ego=0;lead=14;gap=65;position=0;acc=0;emergency=false;last=0;if(av)av._av_reset();draw()}
function draw(){const c=$('road');ctx.clearRect(0,0,800,460);ctx.fillStyle='#1b483a';ctx.fillRect(0,0,800,460);ctx.fillStyle='#384451';ctx.fillRect(170,0,460,460);ctx.strokeStyle='#dce7ef';ctx.lineWidth=5;ctx.setLineDash([35,25]);for(const x of [320,480]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,460);ctx.stroke()}ctx.setLineDash([]);ctx.fillStyle='#268ff5';ctx.fillRect(366,340,68,95);ctx.fillStyle='#9de0fa';ctx.fillRect(377,357,46,23);const leadY=Math.max(-100,340-gap*4);ctx.fillStyle='#efae4c';ctx.fillRect(366,leadY,68,90);ctx.fillStyle='#fbe1ae';ctx.fillRect(377,leadY+16,46,24);$('metrics').textContent='Speed '+(ego*3.6).toFixed(1)+' km/h · Gap '+gap.toFixed(1)+' m · C++ acceleration '+acc.toFixed(2)+' m/s²';}
function tick(t){if(!running)return;if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;if(dt>0){const valid=$('failure').checked?0:1;const desired=+$('target').value/3.6;acc=av._av_accel(ego,lead,gap,dt,valid);if(!valid||acc<=-5.9)emergency=true;else emergency=false;ego=Math.max(0,Math.min(desired,ego+acc*dt));gap=Math.max(0,gap+(lead-ego)*dt);if(gap<=0){running=false;$('state').textContent='COLLISION IN SIMULATION';$('state').style.color='#ff7777'}else{$('state').textContent=!valid?'SENSOR FAILURE — BRAKING':emergency?'EMERGENCY BRAKING':acc<0?'ADAPTIVE CRUISE — BRAKING':'C++ CONTROLLER ACTIVE';$('state').style.color=emergency?'#ff7777':'#72e5b0'}}draw();requestAnimationFrame(tick)}
$('start').onclick=()=>{if(av&&!running){running=true;last=0;requestAnimationFrame(tick)}};$('stop').onclick=()=>running=false;$('hazard').onclick=()=>{lead=0;gap=12;ego=Math.max(ego,22);draw()};$('reset').onclick=reset;$('target').oninput=()=>$('targetLabel').textContent=$('target').value;
if(typeof createAVController!=='function'){$('state').textContent='C++ WebAssembly build not deployed. See repository build instructions.'}else createAVController().then(m=>{av=m;$('start').disabled=false;$('state').textContent='C++ WebAssembly loaded — ready';reset()}).catch(e=>{$('state').textContent='C++ module load failed: '+e.message});draw();
</script></html>
