name: assemble-index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['chunks/part-06.txt']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join chunks into index.html and verify hash
        run: |
          cat chunks/part-*.txt > index.html
          sha256sum index.html
          echo "26158469155f623e491d3038ce20f83c3a28b1290a964e18734baf6862f04f3e  index.html" | sha256sum -c -
          git rm -r -q chunks
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Assemble index.html"
          git push
